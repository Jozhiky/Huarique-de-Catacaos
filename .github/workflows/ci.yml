name: CI — Integración Continua y Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Verificación de Calidad, Base de Datos y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm determinista
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Configurar Node.js 24.14.1 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: "pnpm"

      - name: Instalar dependencias con lockfile congelado
        run: pnpm install --frozen-lockfile

      - name: Configurar Supabase CLI 2.114.0
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Iniciar Supabase Local
        run: supabase start

      - name: Aplicar Migraciones y Semilla en Base de Datos
        run: supabase db reset

      - name: 1. Pruebas de Seguridad y RLS en Base de Datos (pgTAP)
        run: supabase test db

      - name: 2. Análisis Estático de Base de Datos (Database Linter)
        run: supabase db lint --level error

      - name: 3. Verificación de Autenticación Local y Tipos TypeScript
        run: |
          pnpm run seed:local-auth

      - name: 4. Verificación de Formato (Prettier)
        run: pnpm format

      - name: 5. Análisis Estático de Código (ESLint)
        run: pnpm lint

      - name: 6. Comprobación Estricta de Tipos (TypeScript)
        run: pnpm typecheck

      - name: 7. Pruebas Unitarias y de Componentes (Vitest)
        run: pnpm test

      - name: Instalar binarios de Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 8. Pruebas E2E de Tablet (Playwright 1280x800 y 1024x600)
        run: pnpm test:e2e

      - name: 9. Compilación de Producción
        run: pnpm build

      - name: Detener Supabase Local
        if: always()
        run: supabase stop --no-backup
