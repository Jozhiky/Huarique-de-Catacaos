<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <!-- Símbolo Tradicional de Catacaos: Arco, Vasija vertiendo y Recipiente en Dorado #C3A55F -->
  <g fill="none" stroke="#C3A55F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arco Superior Estilizado -->
    <path d="M 40,150 A 60,60 0 0,1 160,150" />
    <path d="M 50,150 A 50,50 0 0,1 150,150" stroke-width="2" />
    
    <!-- Vasija / Chomba de Barro Inclinada -->
    <g transform="translate(85, 95) rotate(-28)">
      <ellipse cx="0" cy="0" rx="22" ry="28" fill="#C3A55F" />
      <path d="M -10,-28 L 10,-28 L 8,-36 L -8,-36 Z" fill="#C3A55F" />
      <path d="M -22,0 Q -32,-10 -22,-20" stroke="#C3A55F" stroke-width="3" fill="none" />
    </g>

    <!-- Chicha Vertiéndose (Flujo continuo hacia el recipiente) -->
    <path d="M 108,105 Q 120,120 128,142" stroke="#C3A55F" stroke-width="4" fill="none" />

    <!-- Recipiente / Poto o Mate Pequeño Receptor -->
    <path d="M 118,145 Q 128,162 138,145 Z" fill="#C3A55F" />
    
    <!-- Base decorativa tradicional -->
    <line x1="30" y1="156" x2="170" y2="156" stroke="#C3A55F" stroke-width="3" />
    <circle cx="100" cy="156" r="3" fill="#C3A55F" />
  </g>

  <!-- Tipografía Oficial Wordmark: HUARIQUE DE CATACAOS con la Q especial -->
  <text x="195" y="112" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#C3A55F" letter-spacing="4">
    HUARI<tspan font-family="'Barlow Condensed', sans-serif">Q</tspan>UE
  </text>
  
  <text x="200" y="152" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-size="34" font-weight="700" fill="#C3A55F" letter-spacing="6">
    DE CATACAOS
  </text>

  <!-- Líneas de Acento y Detalle Tradicional -->
  <line x1="198" y1="124" x2="570" y2="124" stroke="#C3A55F" stroke-width="2" opacity="0.6" />
</svg>
